<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Image Peek</title>
    <meta
      name="description"
      content="Open PowerPoint, Word and Excel files in the browser and save the original images. Nothing leaves your computer."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Office Image Peek" />
    <meta
      property="og:description"
      content="Open PowerPoint, Word and Excel files in the browser and save the original images. Nothing leaves your computer."
    />
    <meta
      property="og:image"
      content="https://piecioshka.github.io/office-image-peek/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#15171b" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      (function () {
        var root = document.documentElement;
        function stored(key) {
          try {
            // Settings saved before the rename used the pptx-peek prefix.
            return (
              localStorage.getItem('office-image-peek:' + key) ||
              localStorage.getItem('pptx-peek:' + key)
            );
          } catch (error) {
            return null;
          }
        }
        var lang = stored('lang');
        if (lang !== 'pl' && lang !== 'en') {
          lang =
            (navigator.language || '').toLowerCase().indexOf('pl') === 0
              ? 'pl'
              : 'en';
        }
        var theme = stored('theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        root.lang = lang;
        root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div class="root" id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
